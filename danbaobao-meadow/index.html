<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>蛋宝宝牧场</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="fit">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="hud">
          <div id="time">1:00</div>
          <div id="count">0 / 11</div>
        </div>
        <div id="stick"></div>
        <div id="result" hidden>
          <p id="score">0 / 11</p>
          <p id="stars"></p>
          <button type="button" id="again">再来一局</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
