name: Deploy 玉兔小屋模块版 (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'yutu-house-mod/**'
      - 'yutu-house/src/**'
      - '.github/workflows/deploy-yutu-house-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-yutu-house-mod
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: yutu-house-mod/package-lock.json

      - name: Build yutu-house-mod
        working-directory: yutu-house-mod
        run: |
          cp ../yutu-house/src/geom_full.json public/geom.json
          npm ci && npm run build

      - name: Commit static site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yutu-house-mod/site
          git diff --staged --quiet && echo "No site changes" && exit 0
          git commit -m "chore(pages): rebuild yutu-house-mod site"
          git push