name: Deploy 蛋宝宝牧场 (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'danbaobao-meadow/**'
      - '.github/workflows/deploy-danbaobao-meadow.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-meadow
  cancel-in-progress: true

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: danbaobao-meadow/package-lock.json

      - name: Build meadow
        working-directory: danbaobao-meadow
        run: npm ci && npm run build

      - name: Commit static site to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add danbaobao-meadow/site
          git diff --staged --quiet && echo "No site changes" && exit 0
          git commit -m "chore(pages): rebuild danbaobao-meadow site"
          git push