<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>蛋宝宝牧场</title>
    <link rel="icon" type="image/svg+xml" href="/eggbabe-h5/danbaobao-meadow/site/favicon.svg" />
    <script type="module" crossorigin src="/eggbabe-h5/danbaobao-meadow/site/assets/index-Oi2Cc8f3.js"></script>
    <link rel="stylesheet" crossorigin href="/eggbabe-h5/danbaobao-meadow/site/assets/index-fbLw9So6.css">
  </head>
  <body>
    <div id="fit">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <div id="hud">
          <div id="time-pill" class="hud-pill">
            <span id="time">0:20</span>
            <span id="level">第 1 关</span>
          </div>
          <div id="count-pill" class="hud-pill">
            <span class="hud-kicker">羊</span>
            <span id="count">0/11</span>
          </div>
        </div>
        <button type="button" id="sound" aria-pressed="true" aria-label="关闭声音">🔊</button>
        <div id="pops"></div>
        <div id="stick"></div>
        <div id="result" hidden>
          <p id="score">0 / 11</p>
          <p id="stars"></p>
          <button type="button" id="again">再来一局</button>
          <button type="button" id="next" hidden>下一关</button>
          <button type="button" id="back" hidden>回第一关</button>
        </div>
      </div>
    </div>
  </body>
</html>
