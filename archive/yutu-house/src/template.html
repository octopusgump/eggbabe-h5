<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>玉兔小屋 Demo</title>
<style>
html,body{margin:0;height:100%;background:#211a10;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#fit{position:absolute;left:50%;top:50%;width:390px;height:844px;transform-origin:50% 50%}
#stage{position:absolute;inset:0;overflow:hidden;background:#2b2412;touch-action:none;cursor:pointer}
#blur{position:absolute;left:-40px;top:-40px;width:470px;height:924px;object-fit:cover;filter:blur(18px) brightness(.62) saturate(1.1);pointer-events:none}
#world{position:absolute;left:0;top:0;width:864px;height:1152px;transform-origin:0 0;will-change:transform}
#world>img.bg{position:absolute;left:0;top:0;width:864px;height:1152px;pointer-events:none;-webkit-mask-image:linear-gradient(transparent 0,#000 90px,#000 1060px,transparent 1152px);mask-image:linear-gradient(transparent 0,#000 90px,#000 1060px,transparent 1152px)}
#world>img.occ{position:absolute;pointer-events:none;z-index:5}
#world>img.occ.front{z-index:20}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 75% at 50% 50%,rgba(0,0,0,0) 55%,rgba(16,10,2,.5) 100%)}
#bun{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:10}
#shadow{position:absolute;left:-19px;top:-6px;width:38px;height:13px;border-radius:50%;background:radial-gradient(closest-side,rgba(45,24,8,.6),rgba(45,24,8,.28) 60%,rgba(45,24,8,0))}
#body{position:absolute;left:0;top:0;width:0;height:0}
#cv{position:absolute;bottom:0;height:74px}
#ripple{position:absolute;left:0;top:0;pointer-events:none;z-index:30}
.rp{position:absolute;left:-18px;top:-8px;width:36px;height:16px;border-radius:50%;border:2.5px solid rgba(255,246,222,.95);box-shadow:0 0 8px rgba(255,220,150,.8);animation:rp .9s ease-out forwards}
.rp.b{animation-delay:.18s;opacity:0}
.dot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:#fff6de;box-shadow:0 0 8px #ffd98a;animation:dot .9s ease-out forwards}
@keyframes rp{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.6);opacity:0}}
@keyframes dot{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
.no{position:absolute;left:-12px;top:-12px;width:24px;height:24px;color:#fff;font:700 22px/24px sans-serif;text-align:center;text-shadow:0 1px 3px #000;animation:dot .6s forwards}
#top{position:absolute;left:0;right:0;top:0;padding:46px 16px 0;pointer-events:none;background:linear-gradient(rgba(24,18,8,.6),rgba(24,18,8,0));height:130px;box-sizing:border-box}
#title{color:#fff8ea;font-weight:700;font-size:18px;letter-spacing:1px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
#chips{display:flex;gap:6px;margin-top:10px;pointer-events:auto}
.chip{padding:5px 11px;border-radius:14px;background:rgba(255,248,234,.2);color:#fff8ea;font-size:12.5px;border:1px solid rgba(255,248,234,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:all .25s}
.chip.on{background:#fff4dc;color:#7a5a32;border-color:#fff4dc;font-weight:600}
#hint{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);padding:9px 16px;border-radius:20px;background:rgba(40,30,16,.55);color:#fff6e2;font-size:13.5px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .5s}
#label{position:absolute;left:50%;top:146px;transform:translate(-50%,-6px);padding:6px 14px;border-radius:16px;background:rgba(255,246,226,.92);color:#6d4f2b;font-size:14px;font-weight:600;opacity:0;transition:all .35s;pointer-events:none;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#label.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div id="fit"><div id="stage">
  <img id="blur" src="data:image/webp;base64,__HOUSES__" alt="">
  <div id="world">
    <img class="bg" src="data:image/webp;base64,__HOUSE__" alt="">
    __OCCS__
    <div id="ripple"></div>
    <div id="bun"><div id="shadow"></div><div id="body"><canvas id="cv"></canvas></div></div>
  </div>
  <div id="vig"></div>
  <div id="top"><div id="title">玉兔的小屋</div><div id="chips"></div></div>
  <div id="label"></div>
  <div id="hint">点地板，玉兔会走过去 · 穿过拱门去别的房间</div>
</div></div>
<img id="sF" src="data:image/webp;base64,__FRONT__" hidden><img id="sC" src="data:image/webp;base64,__CLOSED__" hidden><img id="sS" src="data:image/webp;base64,__SIDE__" hidden>
<script>
const G=__GEOM__;
const VW=390,VH=844,WW=864,WH=1152,SMIN=0.45,SMAX=1.5,BH=74,HOUSE_CY=585;
const cam={x:0,y:0,s:0.55};
const $=id=>document.getElementById(id);
const stage=$('stage'),world=$('world'),bun=$('bun'),body=$('body'),shadow=$('shadow'),cv=$('cv'),ctx=cv.getContext('2d');
const rip=$('ripple'),label=$('label'),hint=$('hint');
const SPR={F:$('sF'),C:$('sC'),S:$('sS')};
function fit(){const k=Math.min(innerWidth/VW,innerHeight/VH);$('fit').style.transform=`translate(-50%,-50%) scale(${k})`;}
addEventListener('resize',fit);fit();

/* ---------- geometry ---------- */
const D=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>p[1])!=(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function distSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1);t=Math.max(0,Math.min(1,t));const q=[a[0]+dx*t,a[1]+dy*t];return{d:Math.hypot(p[0]-q[0],p[1]-q[1]),q};}
function onEdge(p,poly,e=.8){for(let i=0,j=poly.length-1;i<poly.length;j=i++)if(distSeg(p,poly[i],poly[j]).d<e)return true;return false;}
const O=G.outer,OB=G.obst,ALL=[O,...OB];
function walk(p){if(!(inPoly(p,O)||onEdge(p,O)))return false;for(const o of OB)if(inPoly(p,o)&&!onEdge(p,o))return false;return true;}
function segX(a,b,c,d){const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);const d1=o(c,d,a),d2=o(c,d,b),d3=o(a,b,c),d4=o(a,b,d);return d1*d2<-1e-6&&d3*d4<-1e-6;}
function vis(a,b){for(const poly of ALL)for(let i=0,j=poly.length-1;i<poly.length;j=i++)if(segX(a,b,poly[i],poly[j]))return false;
  const n=Math.max(2,Math.ceil(D(a,b)/10));for(let k=1;k<n;k++){const t=k/n;if(!walk([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]))return false;}return true;}
const NODES=[];ALL.forEach(poly=>poly.forEach(p=>{if(walk(p))NODES.push(p);}));
const NV=NODES.map(()=>[]);for(let i=0;i<NODES.length;i++)for(let j=i+1;j<NODES.length;j++)if(vis(NODES[i],NODES[j])){const d=D(NODES[i],NODES[j]);NV[i].push([j,d]);NV[j].push([i,d]);}
function findPath(a,b){if(vis(a,b))return[a,b];
  const n=NODES.length,S=n,T=n+1,dist=new Array(n+2).fill(1e9),prev=new Array(n+2).fill(-1),done=new Array(n+2).fill(false);
  const toT=NODES.map(p=>vis(p,b)?D(p,b):-1);dist[S]=0;
  const adjS=[];NODES.forEach((p,i)=>{if(vis(a,p))adjS.push([i,D(a,p)]);});
  for(;;){let u=-1;for(let i=0;i<n+2;i++)if(!done[i]&&dist[i]<1e9&&(u<0||dist[i]<dist[u]))u=i;if(u<0)break;done[u]=true;if(u===T)break;
    const adj=u===S?adjS:NV[u];for(const [v,d] of adj){if(dist[u]+d<dist[v]){dist[v]=dist[u]+d;prev[v]=u;}}
    if(u<n&&toT[u]>=0&&dist[u]+toT[u]<dist[T]){dist[T]=dist[u]+toT[u];prev[T]=u;}}
  if(prev[T]<0)return null;const out=[];for(let v=T;v!==-1;v=prev[v])out.unshift(v===S?a:v===T?b:NODES[v]);return out;}
function snap(p){if(walk(p))return p;let best=null;for(let r=3;r<=42;r+=3)for(let k=0;k<24;k++){const an=k/24*Math.PI*2,q=[p[0]+Math.cos(an)*r,p[1]+Math.sin(an)*r*.8];if(walk(q)){const d=D(p,q);if(!best||d<best.d)best={q,d};}}return best?best.q:null;}
function roomOf(p){for(let i=0;i<G.rooms.length;i++)if(inPoly(p,G.rooms[i].poly))return i;return -1;}
// occluders
const OCC=G.occ.map((o,i)=>({o,el:$('oc'+i)}));
function baseY(base,x){if(x<=base[0][0])return base[0][1];for(let i=0;i<base.length-1;i++){const a=base[i],b=base[i+1];if(x<=b[0])return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}return base[base.length-1][1];}
// lightmap
const L=G.light;function light(x,y){const fx=Math.max(0,Math.min(L.w-1.001,x/L.cell-.5)),fy=Math.max(0,Math.min(L.h-1.001,y/L.cell-.5));const x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;const c=[0,0,0];
  for(let k=0;k<3;k++){const a=L.rgb[y0][x0][k],b=L.rgb[y0][x0+1][k],c2=L.rgb[y0+1][x0][k],d=L.rgb[y0+1][x0+1][k];c[k]=(a*(1-tx)+b*tx)*(1-ty)+(c2*(1-tx)+d*tx)*ty;}return c;}
const luma=c=>.3*c[0]+.59*c[1]+.11*c[2];
const LREF=G.rooms.reduce((s,r)=>s+luma(light(r.target[0],r.target[1]-30)),0)/G.rooms.length;

/* ---------- state ---------- */
const st={p:[...G.start],path:[],seg:0,walking:false,face:1,phase:0,follow:true,lastDrag:-1e9,nextBlink:2600,blinkUntil:0,arriveT:-1e9,room:0,tint:null};
const chips=$('chips');
G.rooms.forEach((r,i)=>{const c=document.createElement('div');c.className='chip';c.textContent=r.name;c.onpointerdown=e=>e.stopPropagation();c.onpointerup=e=>e.stopPropagation();c.onclick=e=>{e.stopPropagation();goTo(r.target);};chips.appendChild(c);});
function setRoomUI(i){[...chips.children].forEach((c,k)=>c.classList.toggle('on',k===i));}
st.room=roomOf(st.p);setRoomUI(st.room);
let labelTimer=0;function showLabel(t){label.textContent=t;label.classList.add('on');clearTimeout(labelTimer);labelTimer=setTimeout(()=>label.classList.remove('on'),1400);}
function goTo(wp){const q=snap(wp);if(!q){ripple(wp,true);return false;}
  const path=findPath(st.p,q);if(!path){ripple(wp,true);return false;}
  st.path=path.filter((v,i,a)=>i===0||D(v,a[i-1])>.5);st.seg=0;st.walking=st.path.length>1;st.follow=true;ripple(q,false);hint.style.opacity=0;return true;}
function ripple(p,bad){const w=document.createElement('div');w.style.cssText=`position:absolute;left:${p[0]}px;top:${p[1]}px`;
  w.innerHTML=bad?'<div class="no">×</div>':'<div class="rp"></div><div class="rp b"></div><div class="dot"></div>';rip.appendChild(w);setTimeout(()=>w.remove(),1300);}

/* ---------- input ---------- */
const ptrs=new Map();let pinch=null,down=null;
function toStage(e){const r=stage.getBoundingClientRect();return[(e.clientX-r.left)*VW/r.width,(e.clientY-r.top)*VH/r.height];}
function toWorld(s){return[(s[0]+cam.x)/cam.s,(s[1]+cam.y)/cam.s];}
function clampCam(){const w=WW*cam.s,h=WH*cam.s;cam.x=w<=VW?-(VW-w)/2:Math.max(0,Math.min(w-VW,cam.x));
  cam.y=h<=VH?HOUSE_CY*cam.s-VH/2-8:Math.max(0,Math.min(h-VH,cam.y));}
function zoomAt(s,ns){ns=Math.max(SMIN,Math.min(SMAX,ns));const w=toWorld(s);cam.s=ns;cam.x=w[0]*ns-s[0];cam.y=w[1]*ns-s[1];clampCam();}
stage.addEventListener('pointerdown',e=>{const s=toStage(e);ptrs.set(e.pointerId,s);try{stage.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:D(a,b),s:cam.s};down=null;return;}down={s,cx:cam.x,cy:cam.y,moved:false};});
stage.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const s=toStage(e);ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()];zoomAt([(a[0]+b[0])/2,(a[1]+b[1])/2],pinch.s*D(a,b)/pinch.d);st.follow=false;st.lastDrag=now();return;}
  if(!down)return;const dx=s[0]-down.s[0],dy=s[1]-down.s[1];if(Math.abs(dx)>8||Math.abs(dy)>8)down.moved=true;
  if(down.moved){cam.x=down.cx-dx;cam.y=down.cy-dy;clampCam();st.follow=false;st.lastDrag=now();}});
function up(e){ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;down=null;return;}if(!down)return;const d=down;down=null;if(d.moved||e.type==='pointercancel')return;goTo(toWorld(toStage(e)));}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(toStage(e),cam.s*Math.exp(-e.deltaY*.0015));st.follow=false;st.lastDrag=now();},{passive:false});

/* ---------- bunny render ---------- */
const RES=3;let curSpr=null,curTint='';
function drawBunny(spr,tint){const key=spr.id+tint;if(key===curSpr+curTint)return;curSpr=spr.id;curTint=tint;
  const h=BH*RES,w=Math.round(spr.naturalWidth*h/spr.naturalHeight);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  cv.style.height=BH+'px';cv.style.width=(w/RES)+'px';cv.style.left=(-w/RES/2)+'px';
  ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,w,h);ctx.drawImage(spr,0,0,w,h);
  ctx.globalCompositeOperation='multiply';ctx.fillStyle=tint;ctx.fillRect(0,0,w,h);
  ctx.globalCompositeOperation='destination-in';ctx.drawImage(spr,0,0,w,h);ctx.globalCompositeOperation='source-over';}
function tintAt(p){const c=light(p[0],p[1]-34);const l=luma(c);const k=Math.max(.74,Math.min(1.0,.9*Math.pow(l/LREF,.55)));const m=Math.max(c[0],c[1],c[2]);
  const t=c.map(v=>Math.round(255*k*(.6+.4*v/m)));return `rgb(${t[0]},${t[1]},${t[2]})`;}

/* ---------- loop ---------- */
const now=()=>performance.now();let last=now();
const SPEED=110,HOP=.28;
function frame(){const t=now();const dt=Math.min(.05,(t-last)/1000);last=t;
  if(st.walking){let move=SPEED*dt;
    while(move>0&&st.seg<st.path.length-1){const a=st.p,b=st.path[st.seg+1],d=D(a,b);if(d>1e-3){const dx=b[0]-a[0];if(Math.abs(dx)>.25*d)st.face=dx>0?1:-1;}
      if(d<=move){st.p=[...b];st.seg++;move-=d;}else{st.p=[a[0]+(b[0]-a[0])*move/d,a[1]+(b[1]-a[1])*move/d];move=0;}}
    st.phase+=dt/HOP;if(st.seg>=st.path.length-1){st.walking=false;st.arriveT=t;st.phase=0;}
    const r=roomOf(st.p);if(r>=0&&r!==st.room){st.room=r;setRoomUI(r);showLabel(G.rooms[r].name);}}
  let bob=0,sx=1,sy=1,rot=0,side=false;
  if(st.walking){const f=st.phase%1,h=Math.sin(f*Math.PI);bob=-h*7;const land=f<.12?(1-f/.12):(f>.9?(f-.9)/.1:0);
    sy=1-.07*land+.03*h;sx=1+.06*land-.015*h;rot=st.face*(2.5+1.5*Math.sin(f*Math.PI*2));side=true;}
  else{const a=(t-st.arriveT)/1000;if(a<.35){const k=Math.sin(a/.35*Math.PI);sy=1-.08*k;sx=1+.07*k;side=a<.12;}
    const br=Math.sin(t/1000*2*Math.PI/2.6);sy*=1+.018*br;sx*=1-.008*br;}
  if(!st.walking&&t>st.nextBlink){st.blinkUntil=t+140;st.nextBlink=t+2400+Math.random()*2600;}
  const blink=!st.walking&&t<st.blinkUntil;
  drawBunny(side?SPR.S:(blink?SPR.C:SPR.F),tintAt(st.p));
  body.style.transform=`translateY(${bob}px) rotate(${rot}deg) scale(${sx*(side?st.face:1)},${sy})`;
  shadow.style.transform=`scale(${1+bob/18})`;shadow.style.opacity=1+bob/24;
  bun.style.transform=`translate(${st.p[0]}px,${st.p[1]}px)`;
  for(const {o,el} of OCC){el.classList.toggle('front',st.p[1]<baseY(o.base,st.p[0])-1);}
  if((st.follow||t-st.lastDrag>2500)&&!pinch&&!(down&&down.moved)){const k=Math.min(1,dt*3);const ox=cam.x,oy=cam.y;cam.x=st.p[0]*cam.s-VW/2;cam.y=(st.p[1]-40)*cam.s-VH/2;clampCam();cam.x=ox+(cam.x-ox)*k;cam.y=oy+(cam.y-oy)*k;}
  world.style.transform=`translate(${-cam.x}px,${-cam.y}px) scale(${cam.s})`;
  requestAnimationFrame(frame);}
function start(){cam.x=st.p[0]*cam.s-VW/2;clampCam();requestAnimationFrame(frame);window.__ready=true;}
Promise.all(Object.values(SPR).map(i=>i.complete?1:new Promise(r=>i.onload=r))).then(start);
window.__walk={goTo,st,cam,findPath,walk,snap,toScreen:p=>[p[0]*cam.s-cam.x,p[1]*cam.s-cam.y],nodes:NODES.length};
</script></body></html>
