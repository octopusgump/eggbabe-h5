<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#fbf4ea">
  <title>蛋宝宝装扮屋</title>
  <meta name="description" content="蛋宝宝（Eggbabe）互动毛绒装扮屋：锦鲤 12 套装、玉兔 8 配饰、11 套小屋背景、一键导出高清壁纸，内含玉兔小屋与蛋宝宝牧场入口。">
  <meta property="og:title" content="蛋宝宝装扮屋">
  <meta property="og:description" content="BOON KOI 锦鲤与玉兔的互动毛绒装扮屋，支持换装、换背景与导出高清壁纸。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://octopusgump.github.io/eggbabe-h5/">
  <meta property="og:image" content="https://octopusgump.github.io/eggbabe-h5/assets/koi-v2b/work/sets/tex_base_ext.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: #231c15;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #app-shell {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      max-height: 932px;
      background: #fbf4ea;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    }
    @media (min-width: 521px) {
      #app-shell {
        border-radius: 24px;
        height: min(94dvh, 896px);
      }
    }
    @media (max-width: 520px) {
      html, body { background: #fbf4ea; }
      #app-shell {
        max-width: none;
        max-height: none;
        height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }
    #uni-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fbf4ea;
    }
    /* 独立子项目 UI Icon 悬浮快捷入口（右侧舞台空白区，不遮挡顶栏/宠物/衣橱） */
    .world-dock {
      position: absolute;
      right: 10px;
      top: calc(114px + env(safe-area-inset-top, 0px));
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 9px;
      user-select: none;
      -webkit-user-select: none;
    }
    .world-btn {
      width: 46px;
      padding: 6px 4px 5px;
      border-radius: 15px;
      background: rgba(251, 244, 234, 0.90);
      border: 1.5px solid rgba(201, 149, 90, 0.42);
      box-shadow: 0 4px 12px rgba(62, 40, 18, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #5a4636;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: transform .14s ease, border-color .14s ease, background .14s ease;
    }
    .world-btn:hover {
      border-color: #c9955a;
      background: rgba(255, 253, 249, 0.98);
      transform: scale(1.04);
    }
    .world-btn:active {
      transform: scale(0.95);
    }
    .world-btn svg {
      width: 22px;
      height: 22px;
      display: block;
    }
    .world-btn span {
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .02em;
      color: #5a4636;
    }
  </style>
</head>
<body>
  <div id="app-shell">
    <iframe id="uni-frame" title="蛋宝宝装扮屋" src="./eggbabe-uni/site/"></iframe>

    <nav class="world-dock" aria-label="扩展场景入口">
      <a class="world-btn" href="./yutu-house-mod.html" title="进入玉兔小屋">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.5 11.2L12 4.2l8.5 7" stroke="#c9955a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 10.2V19a1.4 1.4 0 0 0 1.4 1.4h9.2A1.4 1.4 0 0 0 18 19v-8.8" fill="#fffdf9" stroke="#7a5b3e" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M10.2 20.4v-4.6a1.8 1.8 0 0 1 3.6 0v4.6" fill="#e9c89b" stroke="#7a5b3e" stroke-width="1.5"/>
        </svg>
        <span>小屋</span>
      </a>
      <a class="world-btn" href="./danbaobao-meadow.html" title="进入蛋宝宝牧场">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 18.5c2.5-2.2 5.3-3.2 8-3.2s5.5 1 8 3.2" stroke="#7ea862" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="12" cy="11.2" r="4.2" fill="#fffdf9" stroke="#7a5b3e" stroke-width="1.6"/>
          <circle cx="8.6" cy="10.4" r="2.1" fill="#fffdf9" stroke="#7a5b3e" stroke-width="1.5"/>
          <circle cx="15.4" cy="10.4" r="2.1" fill="#fffdf9" stroke="#7a5b3e" stroke-width="1.5"/>
          <circle cx="12" cy="8.2" r="2.2" fill="#fffdf9" stroke="#7a5b3e" stroke-width="1.5"/>
          <circle cx="10.8" cy="11.4" r="0.8" fill="#4f3d2e"/>
          <circle cx="13.2" cy="11.4" r="0.8" fill="#4f3d2e"/>
        </svg>
        <span>牧场</span>
      </a>
    </nav>
  </div>
</body>
</html>
