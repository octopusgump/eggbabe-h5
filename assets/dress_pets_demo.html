<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>玉兔 · 锦鲤 自由试衣</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #1e1a16; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh; }
    #bar {
      position: sticky; top: 0; z-index: 20; width: 100%; max-width: 420px;
      display: flex; justify-content: center; align-items: center; gap: 8px;
      padding: 10px 12px 8px;
      background: rgba(30, 26, 22, 0.94); backdrop-filter: blur(8px);
    }
    .pill {
      border: 1.5px solid rgba(201, 149, 90, 0.35); background: rgba(255, 253, 249, 0.08);
      color: #e8dfd3; padding: 6px 18px; border-radius: 999px; font: 600 14px/1.2 sans-serif;
      cursor: pointer; transition: all .15s ease;
    }
    .pill.active { border-color: #c9955a; background: #fbf4ea; color: #5a4636; }
    #view { flex: 1; width: 100%; max-width: 420px; border: 0; display: block; min-height: 0; }
  </style>
</head>
<body>
  <div id="bar">
    <button type="button" class="pill active" data-src="v2b/yutu_mesh_demo.html">玉兔</button>
    <button type="button" class="pill" data-src="koi-v2b/koi_mesh_demo.html">锦鲤</button>
  </div>
  <iframe id="view" title="dress demo" src="v2b/yutu_mesh_demo.html"></iframe>
  <script>
    const view = document.getElementById("view");
    document.querySelectorAll(".pill").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const src = btn.getAttribute("data-src");
        if (view.getAttribute("src") === src) return;
        document.querySelectorAll(".pill").forEach(function (b) { b.classList.toggle("active", b === btn); });
        view.setAttribute("src", src);
      });
    });
    function fit() {
      const h = innerHeight - document.getElementById("bar").offsetHeight;
      view.style.height = Math.max(480, h) + "px";
    }
    fit(); addEventListener("resize", fit);
  </script>
</body>
</html>
