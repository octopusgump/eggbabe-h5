<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>玉兔 · 锦鲤 自由试衣</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #1e1a16; font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; min-height: 100dvh; }
  #bar {
      position: sticky; top: 0; z-index: 20; width: 100%; max-width: 420px;
      display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 8px;
      background: rgba(30, 26, 22, 0.94); backdrop-filter: blur(8px);
    }
    .pet-row { display: flex; gap: 8px; justify-content: center; align-items: center; }
    .pill {
      border: 1.5px solid rgba(201, 149, 90, 0.35); background: rgba(255, 253, 249, 0.08);
      color: #e8dfd3; padding: 6px 18px; border-radius: 999px; font: 600 14px/1.2 sans-serif;
      cursor: pointer; transition: all .15s ease;
    }
    .pill.active { border-color: #c9955a; background: #fbf4ea; color: #5a4636; }
    #bg-strip {
      display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 4px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    #bg-strip::-webkit-scrollbar { display: none; }
    .bg-chip {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px 3px 4px; border-radius: 999px;
      border: 1.5px solid rgba(255, 248, 238, 0.14);
      background: rgba(255, 253, 249, 0.06); color: #d8cfc3;
      font: 500 12px/1.2 sans-serif; cursor: pointer; transition: all .15s ease;
    }
    .bg-chip img {
      width: 22px; height: 22px; border-radius: 50%; object-fit: cover;
      border: 1px solid rgba(255,255,255,.25); display: block;
    }
    .bg-chip.active {
      border-color: #e0b074; background: rgba(251, 244, 234, 0.18); color: #fff8ee;
    }
    #view { flex: 1; width: 100%; max-width: 420px; border: 0; display: block; min-height: 0; }
  </style>
</head>
<body>
  <div id="bar">
    <div class="pet-row">
      <button type="button" class="pill active" data-src="v2b/yutu_mesh_demo.html">玉兔</button>
      <button type="button" class="pill" data-src="koi-v2b/koi_mesh_demo.html">锦鲤</button>
    </div>
    <div id="bg-strip" aria-label="背景切换"></div>
  </div>
  <iframe id="view" title="dress demo" src="v2b/yutu_mesh_demo.html"></iframe>
  <script>
    const BGS = [
      { id: "room_bg", name: "奶油暖屋", src: "shared/room_bg.jpg", stageBg: "#f0e2cc",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(86,52,28,.32) 0%, rgba(92,58,32,.19) 28%, rgba(110,72,40,.09) 52%, rgba(120,80,46,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(52,32,16,.46) 0%, rgba(62,38,20,.2) 42%, rgba(62,38,20,0) 74%)" },
      { id: "bg_winter_blue", name: "冬日蓝菱格", src: "shared/bgs/bg_winter_blue.jpg", stageBg: "#5b7996",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(36,52,72,.32) 0%, rgba(44,62,84,.18) 30%, rgba(56,74,96,.08) 54%, rgba(56,74,96,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(26,38,54,.46) 0%, rgba(34,48,66,.2) 42%, rgba(34,48,66,0) 74%)" },
      { id: "bg_mint_room", name: "复古薄荷房", src: "shared/bgs/bg_mint_room.jpg", stageBg: "#b8c7b3",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(78,58,34,.30) 0%, rgba(88,66,40,.17) 30%, rgba(102,78,48,.08) 54%, rgba(102,78,48,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(50,36,20,.44) 0%, rgba(60,44,24,.19) 42%, rgba(60,44,24,0) 74%)" },
      { id: "bg_moon_courtyard", name: "桂月亭台夜", src: "shared/bgs/bg_moon_courtyard.jpg", stageBg: "#27335c",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(20,24,48,.42) 0%, rgba(28,32,62,.24) 30%, rgba(36,42,74,.10) 54%, rgba(36,42,74,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(14,16,34,.56) 0%, rgba(22,26,48,.26) 42%, rgba(22,26,48,0) 74%)" },
      { id: "bg_lotus_pond", name: "荷灯锦鲤池", src: "shared/bgs/bg_lotus_pond.jpg", stageBg: "#16384c",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(20,30,46,.42) 0%, rgba(28,40,58,.24) 30%, rgba(38,52,72,.10) 54%, rgba(38,52,72,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(14,22,34,.56) 0%, rgba(22,32,48,.26) 42%, rgba(22,32,48,0) 74%)" },
      { id: "bg_plush_meadow", name: "星夜绒花坡", src: "shared/bgs/bg_plush_meadow.jpg", stageBg: "#2b2566",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(68,36,56,.36) 0%, rgba(82,46,68,.20) 30%, rgba(96,58,80,.09) 54%, rgba(96,58,80,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(44,22,38,.50) 0%, rgba(56,30,48,.22) 42%, rgba(56,30,48,0) 74%)" },
      { id: "bg_sunset_meadow", name: "晚霞云朵坡", src: "shared/bgs/bg_sunset_meadow.jpg", stageBg: "#8e6d88",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(76,58,44,.34) 0%, rgba(88,68,52,.19) 30%, rgba(104,82,64,.08) 54%, rgba(104,82,64,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(50,36,26,.48) 0%, rgba(62,46,34,.22) 42%, rgba(62,46,34,0) 74%)" },
      { id: "bg_deep_sea", name: "幻光深海屋", src: "shared/bgs/bg_deep_sea.jpg", stageBg: "#1c6392",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(56,36,78,.34) 0%, rgba(68,46,92,.19) 30%, rgba(84,58,108,.08) 54%, rgba(84,58,108,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(38,24,56,.48) 0%, rgba(50,32,72,.22) 42%, rgba(50,32,72,0) 74%)" },
      { id: "bg_autumn_cabin", name: "秋日暖炉屋", src: "shared/bgs/bg_autumn_cabin.jpg", stageBg: "#5b321a",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(46,22,10,.44) 0%, rgba(58,28,14,.25) 30%, rgba(72,38,18,.11) 54%, rgba(72,38,18,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(28,12,6,.58) 0%, rgba(40,18,8,.28) 42%, rgba(40,18,8,0) 74%)" },
      { id: "bg_candy_hearth", name: "甜梦糖果屋", src: "shared/bgs/bg_candy_hearth.jpg", stageBg: "#2d6f82",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(92,42,42,.34) 0%, rgba(108,52,52,.19) 30%, rgba(124,64,64,.08) 54%, rgba(124,64,64,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(62,26,28,.48) 0%, rgba(76,34,36,.22) 42%, rgba(76,34,36,0) 74%)" },
      { id: "bg_pink_cloud", name: "暮粉祥云境", src: "shared/bgs/bg_pink_cloud.jpg", stageBg: "#b38fa3",
        soft: "radial-gradient(ellipse at 48% 46%, rgba(86,52,74,.32) 0%, rgba(98,62,86,.18) 30%, rgba(114,76,100,.08) 54%, rgba(114,76,100,0) 76%)",
        con: "radial-gradient(ellipse at 50% 50%, rgba(58,34,50,.46) 0%, rgba(72,44,62,.20) 42%, rgba(72,44,62,0) 74%)" }
    ];
    let currentBg = BGS[0];
    const view = document.getElementById("view");
    const strip = document.getElementById("bg-strip");

    function applyBgToFrame() {
      try {
        const doc = view.contentDocument;
        if (!doc) return;
        const bgEl = doc.getElementById("bg");
        const stEl = doc.getElementById("stage");
        const shS = doc.getElementById("shadow-soft");
        const shC = doc.getElementById("shadow-contact");
        if (bgEl) bgEl.src = new URL(currentBg.src, location.href).href;
        if (stEl) stEl.style.background = currentBg.stageBg;
        if (shS) shS.style.background = currentBg.soft;
        if (shC) shC.style.background = currentBg.con;
      } catch (e) {
        console.warn("Background swap requires same-origin HTTP context:", e);
      }
    }

    BGS.forEach(function (bg, idx) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "bg-chip" + (idx === 0 ? " active" : "");
      btn.setAttribute("data-bg", bg.id);
      btn.innerHTML = '<img alt="" src="' + bg.src + '"><span>' + bg.name + '</span>';
      btn.addEventListener("click", function () {
        currentBg = bg;
        strip.querySelectorAll(".bg-chip").forEach(function (b) { b.classList.toggle("active", b === btn); });
        applyBgToFrame();
      });
      strip.appendChild(btn);
    });

    view.addEventListener("load", applyBgToFrame);

    document.querySelectorAll(".pill").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const src = btn.getAttribute("data-src");
        if (view.getAttribute("src") === src) return;
        document.querySelectorAll(".pill").forEach(function (b) { b.classList.toggle("active", b === btn); });
        view.setAttribute("src", src);
      });
    });
    function fit() {
      const h = innerHeight - document.getElementById("bar").offsetHeight - 8;
      view.style.height = Math.max(480, h) + "px";
    }
    fit(); addEventListener("resize", fit);
  </script>
</body>
</html>
