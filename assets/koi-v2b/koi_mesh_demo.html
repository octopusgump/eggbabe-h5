<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>锦鲤 BOON KOI · 套装弹性透明换装 Demo</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #2a2118; overflow: hidden; }
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
  #fit { width: 390px; height: 844px; flex-shrink: 0; transform-origin: center center; }
  #stage { width: 390px; height: 844px; position: relative; overflow: hidden; border-radius: 20px; box-shadow: 0 18px 50px rgba(0,0,0,.4); background: #f0e2cc; touch-action: none; user-select: none; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #gl { position: absolute; left: 0; top: 0; width: 390px; height: 844px; z-index: 2; pointer-events: none; }
  #shadow-soft { position: absolute; left: 207.0px; top: 623.0px; width: 168px; height: 46px; transform: translate(-50%,-50%);
    background: radial-gradient(ellipse at 48% 46%, rgba(86,52,28,.32) 0%, rgba(92,58,32,.19) 28%, rgba(110,72,40,.09) 52%, rgba(120,80,46,0) 76%); filter: blur(8px); z-index: 1; pointer-events: none; }
  #shadow-contact { position: absolute; left: 198.0px; top: 629.0px; width: 116px; height: 15px; transform: translate(-50%,-50%);
    background: radial-gradient(ellipse at 50% 50%, rgba(52,32,16,.46) 0%, rgba(62,38,20,.2) 42%, rgba(62,38,20,0) 74%); filter: blur(2.2px); z-index: 1; pointer-events: none; }
  .zz { position: absolute; left: 0; top: 0; font: 700 15px/1 sans-serif; color: #8a7a68; opacity: 0; pointer-events: none; z-index: 3; }

  #sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; background: #fbf4ea; border-radius: 26px 26px 0 0; box-shadow: 0 -10px 30px rgba(80,50,20,.14); padding: 8px 14px calc(16px + env(safe-area-inset-bottom, 0px)); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #sheet .handle { width: 38px; height: 4px; background: #e4d3bf; border-radius: 99px; margin: 2px auto 8px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  .tab { flex: 1; padding: 6px 10px; border-radius: 999px; border: 1.5px solid #e6d5c1; background: #fffdf9; color: #7a634d; font: 600 12px/1.2 system-ui, sans-serif; cursor: pointer; }
  .tab.active { background: #c9955a; border-color: #c9955a; color: #fff; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .card { position: relative; background: #fffdf9; border-radius: 14px; border: 2px solid rgba(201,149,90,0); box-shadow: 0 1px 3px rgba(80,50,20,.08); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px 4px 5px; cursor: pointer; appearance: none; -webkit-appearance: none; }
  .card.hidden { display: none; }
  .card .thumb-wrap { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .card-name { margin-top: 3px; font: 600 10.5px/1.15 system-ui, sans-serif; color: #4f3d2e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .card-price { margin-top: 2px; font: 600 10px/1 system-ui, sans-serif; color: #c48840; }
  .card.selected { border-color: #c9955a; box-shadow: 0 0 0 1.5px #c9955a, 0 2px 6px rgba(201,149,90,.2); }
  .card .badge { display: none; position: absolute; top: 4px; right: 4px; width: 17px; height: 17px; border-radius: 50%; background: #c9955a; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .card.selected .badge { display: flex; }
  .card .badge svg { display: block; width: 10px; height: 10px; }
</style>

      { o: 0.55, e: "lin", headRot: 12 * s, rot: 1.5 * s, headTy: 3, wDoze: 1 },
      { o: 0.66, e: "out", headRot: 10 * s, rot: 1 * s, headTy: 2, wDoze: 0 },
      { o: 0.84, e: "io", headRot: 4 * s, earL: 3 * s, earR: 3 * s },
      { o: 1, e: "out" }
    ], u);
  }
  function doze(t) {
    const b = Math.sin(t / 4400 * Math.PI * 2);
    return P({ sx: 1.01, sy: 0.985 + 0.008 * b, breath: 0.022 * b, headRot: 6 + 1.2 * b, headTy: 6, rot: 1, earL: -4 + b, earR: 8 + 2 * b, wDoze: 1, shS: 1.03 });
  }
  function dozeEnter(from, u) {
    const p = mix(from, doze(0), easeInOut(clamp(u / 0.6, 0, 1)));
    p.wDoze = u < 0.18 ? easeOutCubic(u / 0.18) : 1;
    // the ear droops slowly, last
    p.earR = lerp(from.earR, doze(0).earR, easeInOut(clamp((u - 0.35) / 0.65, 0, 1)));
    return p;
  }
  function wake(u, from) {
    return kf([
      Object.assign({ o: 0, e: "out" }, from),
      { o: 0.2, e: "out", wDoze: 0.5, headRot: 2, earR: 30, sy: 1.04, sx: 0.98, hopY: -2 },
      { o: 0.42, e: "io", wDoze: 0, sy: 1.09, sx: 0.95, hopY: -10, earL: 6, earR: -10 },
      { o: 0.62, e: "lin", sy: 1.05, sx: 0.97, hopY: -5, earL: -3, earR: 5, wDoze: 0.9 },
      { o: 0.72, e: "out", wDoze: 0 },
      { o: 1, e: "out" }
    ], u);
  }
  function pet(lean, t) {
    const tw = Math.sin(t / 3000 * Math.PI * 2);
    return P({ sx: 1.015, sy: 0.985, lean: lean, headRot: 7 * lean, rot: 2 * lean, headTy: 4, earL: -15 + 2 * tw, earR: 15 - 2 * tw, wClosed: 1, breath: 0.01 * tw });
  }

  /* ---------- live state machine ---------- */
  const SLEEP_DELAY = 7000, DOZE_ENTER_MS = 2600, TILT_MS = 950, WAKE_MS = 1100, PET_RELEASE_MS = 700, BLEND_MS = 140;
  let live = true, mode = "idle", t0 = performance.now(), idleT0 = t0, nextBlink = 2600, sleepAt = t0 + SLEEP_DELAY, sleepDelay = SLEEP_DELAY;
  let from = P({}), blendFrom = null, blendUntil = 0, tiltSide = 1, petLean = 0, zzAt = 0;
  function begin(m, now) { mode = m; t0 = now; from = lastPose; blendFrom = lastPose; blendUntil = now + BLEND_MS; live = true; }
  function toIdle(now) { mode = "idle"; idleT0 = now; nextBlink = 2400 + Math.random() * 1600; sleepAt = now + sleepDelay; blendFrom = lastPose; blendUntil = now + 260; }
  function blend(p, now) { if (!blendFrom || now >= blendUntil) return p; const span = mode === "idle" ? 260 : BLEND_MS; return mix(blendFrom, p, easeOutCubic(clamp(1 - (blendUntil - now) / span, 0, 1))); }
  function tick(now) {
    requestAnimationFrame(tick);
    if (!live || document.hidden) return;
    const t = now - t0;
    if (mode === "idle") {
      if (now >= sleepAt) { begin("doze-enter", now); return; }
      const it = now - idleT0; let bl = 0;
      if (it >= nextBlink) { bl = blinkAmt((it - nextBlink) / BLINK_MS); if (it > nextBlink + BLINK_MS) nextBlink = it + 2600 + Math.random() * 1800; }
      render(blend(idle(it, bl), now), now);
    } else if (mode === "jump") { if (t >= JUMP_MS) toIdle(now); else render(blend(jump(t / JUMP_MS), now), now); }
    else if (mode === "tilt") { if (t >= TILT_MS) toIdle(now); else render(blend(tilt(t / TILT_MS, tiltSide), now), now); }
    else if (mode === "doze-enter") { if (t >= DOZE_ENTER_MS) { mode = "doze"; t0 = now; } render(dozeEnter(from, t / DOZE_ENTER_MS), now); }
    else if (mode === "doze") { render(doze(t), now); if (now > zzAt) { spawnZz(); zzAt = now + 1700; } }
    else if (mode === "wake") { if (t >= WAKE_MS) toIdle(now); else render(wake(t / WAKE_MS, from), now); }
    else if (mode === "pet") { render(blend(pet(petLean, t), now), now); }
    else if (mode === "pet-release") { if (t >= PET_RELEASE_MS) toIdle(now); else { const u = t / PET_RELEASE_MS; const p = mix(pet(petLean, 0), idle(0, 0), easeInOut(u)); p.wClosed = u < 0.4 ? 1 : 1 - easeOutCubic((u - 0.4) / 0.6); render(p, now); } }
    else if (mode === "minihop") { if (t >= MINI_MS) toIdle(now); else render(minihop(t / MINI_MS), now); }
  }
  function spawnZz() {
    const n = document.createElement("div"); n.className = "zz"; n.textContent = "z"; stage.appendChild(n);
    const x = OX + 600 * S, y = OY + 520 * S;
    const a = n.animate([{ transform: "translate(" + x + "px," + y + "px) scale(.7)", opacity: 0 }, { transform: "translate(" + (x + 6) + "px," + (y - 14) + "px)", opacity: .85, offset: .3 }, { transform: "translate(" + (x + 16) + "px," + (y - 40) + "px) scale(1.25)", opacity: 0 }], { duration: 1500, easing: "ease-out", fill: "forwards" });
    a.onfinish = function () { n.remove(); };
  }

  /* ---------- input: hit test on opaque pixels of the rest pose ---------- */
  function toSrc(ev) {
    const r = stage.getBoundingClientRect();
    const sx = (ev.clientX - r.left) / r.width * 390, sy = (ev.clientY - r.top) / r.height * 844 - lastPose.hopY;
    return { x: (sx - OX) / S, y: (sy - OY) / S, stageX: sx };
  }
  function hitAcc(srcX, srcY) {
    if (worn && worn.set) return false;
    const ids = worn ? ["dorsal", "neck", "hand", "head"].map(function (s) { return worn[s]; }) : [];
    for (let i = 0; i < ids.length; i++) {
      const id = ids[i]; if (!id) continue;
      const rec = accItems[id]; if (!rec || !rec.hit) continue;
      if (srcX < rec.x || srcY < rec.y || srcX >= rec.x + rec.w || srcY >= rec.y + rec.h) continue;
      const u = (srcX - rec.x) / rec.w * rec.hitW, v = (srcY - rec.y) / rec.h * rec.hitH;
      if (rec.hit.getImageData(Math.floor(u), Math.floor(v), 1, 1).data[3] > 60) return true;
    }
    return false;
  }
  function hit(ev) {
    const s = toSrc(ev), lx = Math.floor(s.x - TEX.x0), ly = Math.floor(s.y - TEX.y0);
    if (ready < 3) return null;
    let body = false;
    if (lx >= 0 && ly >= 0 && lx < TEX.w && ly < TEX.h) body = hitCtx.getImageData(lx, ly, 1, 1).data[3] >= 40;
    if (!body && !hitAcc(s.x, s.y)) return null;
    const hd = Math.pow((s.x - HEAD.x) / HEAD.rx, 2) + Math.pow((s.y - HEAD.y) / HEAD.ry, 2);
    return { face: hd <= 1 || s.y < NECK.y, x: s.x, stageX: s.stageX };
  }
  let ptr = null;
  stage.addEventListener("pointerdown", function (ev) {
    ev.preventDefault(); const h = hit(ev); if (!h) return;
    if (mode === "doze" || mode === "doze-enter") { begin("wake", performance.now()); return; }
    if (mode !== "idle") return;
    ptr = { id: ev.pointerId, x0: h.stageX, t: performance.now(), face: h.face, side: h.x < CX ? -1 : 1, petting: false };
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  stage.addEventListener("pointermove", function (ev) {
    if (!ptr || ev.pointerId !== ptr.id) return;
    const r = stage.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width * 390, dx = x - ptr.x0;
    if (!ptr.petting && Math.abs(dx) > 16) { ptr.petting = true; begin("pet", performance.now()); }
    if (ptr.petting) petLean = lerp(petLean, clamp(dx / 50, -1, 1), 0.3);
  });
  function up(ev) {
    if (!ptr || ev.pointerId !== ptr.id) return;
    const p = ptr; ptr = null; const now = performance.now();
    if (p.petting) { begin("pet-release", now); return; }
    if (now - p.t > 500 || mode !== "idle") return;
    if (p.face) { tiltSide = p.side; begin("tilt", now); } else begin("jump", now);
  }
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  function fitStage() { const s = Math.min(1, (innerWidth - 20) / 390, (innerHeight - 20) / 844); fit.style.transform = "scale(" + s + ")"; }
  fitStage(); addEventListener("resize", fitStage);

  /* ---------- dress-up ---------- */
  const MINI_MS = 620;
  function syncWearUI() {
    ITEMS.forEach(function (it) {
      const card = document.querySelector('.card[data-id="' + it.id + '"]');
      if (!card) return;
      const on = it.slot === "set" ? worn.set === it.id : (!worn.set && (it.slot === "boots" ? worn.boots === it.id : worn[it.slot] === it.id));
      card.classList.toggle("selected", on);
    });
    if (ready >= 3) render(lastPose);
  }
  function wearItem(id, hop) {
    const it = ITEMS.filter(function (x) { return x.id === id; })[0];
    if (!it) return;
    if (it.slot === "set") {
      if (worn.set === id) { worn.set = null; syncWearUI(); return; }
      worn.set = id;
      worn.head = worn.neck = worn.dorsal = worn.hand = null;
      syncWearUI();
      if (hop !== false && (mode === "idle" || mode === "pet-release")) begin("minihop", performance.now());
      return;
    }
    // Equipping any single accessory clears active full-body set
    if (worn.set) worn.set = null;
    if (it.slot === "boots") {
      if (worn.boots === id) { worn.boots = "boots_yellow"; syncWearUI(); return; }
      worn.boots = id; syncWearUI();
      if (hop !== false && (mode === "idle" || mode === "pet-release")) begin("minihop", performance.now());
      return;
    }
    if (worn[it.slot] === id) { worn[it.slot] = null; syncWearUI(); return; }
    worn[it.slot] = id; syncWearUI();
    if (hop !== false && (mode === "idle" || mode === "pet-release")) {
      begin("minihop", performance.now());
    }
  }
  function setWorn(head, neck) { worn.set = null; worn.head = head || null; worn.neck = neck || null; syncWearUI(); }
  function wearSet(id, hop) { wearItem(id, hop); }
  document.querySelectorAll("#grid .card").forEach(function (card) {
    const id = card.getAttribute("data-id");
    const it = ITEMS.filter(function (x) { return x.id === id; })[0];
    const img = card.querySelector("img");
    if (it && img) img.src = it.thumb;
  });
  const sheet = document.getElementById("sheet");
  // Only stopPropagation (never preventDefault) so mobile browsers synthesize click cleanly
  ["pointerdown", "pointermove", "pointerup", "pointercancel"].forEach(function (tp) {
    sheet.addEventListener(tp, function (ev) { ev.stopPropagation(); }, true);
  });
  sheet.addEventListener("click", function (ev) {
    const tab = ev.target.closest(".tab");
    if (tab) {
      const targetTab = tab.getAttribute("data-tab");
      document.querySelectorAll("#sheet .tab").forEach(function (b) { b.classList.toggle("active", b === tab); });
      document.querySelectorAll("#grid .card").forEach(function (c) { c.classList.toggle("hidden", c.getAttribute("data-tab") !== targetTab); });
      return;
    }
    const card = ev.target.closest(".card"); if (!card) return;
    ev.stopPropagation();
    wearItem(card.getAttribute("data-id"), true);
  });
  function minihop(u) {
    const kfs = [
      { o: 0, e: "in", hopY: 0, sx: 1, sy: 1, shS: 1, shO: 1 },
      { o: 0.18, e: "out", hopY: 4, sx: 1.08, sy: 0.9, shS: 1.12, shO: 0.9 },
      { o: 0.4, e: "out", hopY: -28, sx: 0.96, sy: 1.06, earL: -10, earR: 10, shS: 0.6, shO: 0.4 },
      { o: 0.78, e: "back", hopY: 3, sx: 1.08, sy: 0.9, shS: 1.12, shO: 0.85 },
      { o: 1, e: "out", hopY: 0, sx: 1, sy: 1, shS: 1, shO: 1 }
    ];
    return kf(kfs, u);
  }

  requestAnimationFrame(tick);

  /* ---------- scripted timeline for screenshots / video ---------- */
  const TL = { blink: 900, jump: 1700, tilt: 3200, pet: 4600, petRel: 5900, doze: 6900, dozeHold: 9500, wake: 11000, end: 12300 };
  function poseAt(ms) {
    if (ms < TL.jump) return idle(ms, blinkAmt((ms - TL.blink) / BLINK_MS));
    if (ms < TL.jump + JUMP_MS) return jump((ms - TL.jump) / JUMP_MS);
    if (ms < TL.tilt) return idle(ms - TL.jump - JUMP_MS, 0);
    if (ms < TL.tilt + TILT_MS) return tilt((ms - TL.tilt) / TILT_MS, 1);
    if (ms < TL.pet) return idle(ms - TL.tilt - TILT_MS, 0);
    if (ms < TL.petRel) { const u = (ms - TL.pet) / (TL.petRel - TL.pet); return mix(idle(0, 0), pet(0.8 * easeOutCubic(clamp(u / 0.4, 0, 1)), ms - TL.pet), easeOutCubic(clamp(u / 0.15, 0, 1))); }
    if (ms < TL.petRel + PET_RELEASE_MS) { const u = (ms - TL.petRel) / PET_RELEASE_MS; const p = mix(pet(0.8, 0), idle(0, 0), easeInOut(u)); p.wClosed = u < 0.4 ? 1 : 1 - easeOutCubic((u - 0.4) / 0.6); return p; }
    if (ms < TL.doze) return idle(ms - TL.petRel - PET_RELEASE_MS, 0);
    if (ms < TL.dozeHold) return dozeEnter(idle(0, 0), (ms - TL.doze) / (TL.dozeHold - TL.doze));
    if (ms < TL.wake) return doze(ms - TL.dozeHold);
    if (ms < TL.wake + WAKE_MS) return wake((ms - TL.wake) / WAKE_MS, doze(TL.wake - TL.dozeHold));
    return idle(ms - TL.wake - WAKE_MS, 0);
  }
  window.__demo = {
    timeline: TL, jumpMs: JUMP_MS, mode: function () { return mode; },
    seek: function (ms) { live = false; render(poseAt(ms), ms); return ms; },
    live: function () { live = true; toIdle(performance.now()); },
    setSleepDelay: function (ms) { sleepDelay = ms; sleepAt = performance.now() + ms; },
    wear: function (id, hop) { live = true; wearItem(id, hop !== false); },
    wearSet: function (id, hop) { live = true; wearSet(id, hop !== false); },
    setWorn: setWorn,
    worn: function () { return { set: worn.set, head: worn.head, neck: worn.neck, boots: worn.boots }; }
  };
})();
</script>
