<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>蛋宝宝牧场 · 3D 粘土赶小羊</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script src="../../cross-end-store.js"></script>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas"></canvas>

      <!-- 独立访问顶栏（内嵌于 #activity-player 时自动隐藏，避免双顶栏） -->
      <header id="standalone-header" class="eb-topbar">
        <a id="btn-standalone-back" class="eb-topbar__back" href="../../../">← 返回房间</a>
        <h1 class="eb-topbar__title">蛋宝宝牧场</h1>
        <span id="standalone-star-pill" class="eb-topbar__stars">✦ 0</span>
      </header>

      <!-- 顶部极简双胶囊 HUD + 静音/暂停悬浮钮 -->
      <div id="hud">
        <div class="hud-left">
          <div id="time-pill" class="hud-pill">
            <span id="time">0:25</span>
            <span class="hud-dot" aria-hidden="true"></span>
            <span id="level">第1关 · 晴日草场</span>
          </div>
        </div>
        <div class="hud-right">
          <div id="count-pill" class="hud-pill hud-pill--count">
            <span id="pet-badge" class="hud-pet-tag">玉兔上场</span>
            <span id="count">0/11</span>
          </div>
        </div>
      </div>

      <div class="fab-rail" aria-label="快捷控制">
        <button type="button" id="sound" class="eb-fab" aria-pressed="true" aria-label="关闭声音">
          <svg id="icon-sound-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5L6 9H3v6h3l5 4V5z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7" />
            <path d="M18.5 6a8.5 8.5 0 0 1 0 12" />
          </svg>
          <svg id="icon-sound-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
            <path d="M11 5L6 9H3v6h3l5 4V5z" />
            <line x1="22" y1="9" x2="16" y2="15" />
            <line x1="16" y1="9" x2="22" y2="15" />
          </svg>
        </button>
        <button type="button" id="btn-pause" class="eb-fab" aria-label="暂停与选关">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="9" y1="6" x2="9" y2="18" />
            <line x1="15" y1="6" x2="15" y2="18" />
          </svg>
        </button>
      </div>

      <div id="pops"></div>

      <!-- 开局轻引导（Design System inline-notice，移动摇杆即开始倒计时） -->
      <div id="ready-notice" class="eb-inline-notice" role="status" aria-live="polite">
        拖动摇杆，把小羊赶进四角木羊圈
      </div>

      <!-- 右下虚拟摇杆 -->
      <div id="stick"></div>

      <!-- 暂停与选关卡片 -->
      <div id="pause-modal" class="eb-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="牧场暂停">
        <div id="pause-backdrop" class="eb-modal__backdrop"></div>
        <div class="eb-card">
          <p class="eb-card__eyebrow">蛋宝宝牧场</p>
          <h2 class="eb-card__title">先歇一小会儿</h2>
          <div class="eb-level-picker" role="group" aria-label="选择草场关卡">
            <button type="button" class="eb-level-chip is-active" data-level-pick="1">1 · 晴日草场</button>
            <button type="button" class="eb-level-chip" data-level-pick="2">2 · 溪流北坡</button>
            <button type="button" class="eb-level-chip" data-level-pick="3">3 · 暖丘溪谷</button>
          </div>
          <div class="eb-card__actions">
            <button type="button" id="btn-resume" class="eb-btn eb-btn--primary">继续赶羊</button>
            <button type="button" id="btn-pause-restart" class="eb-btn eb-btn--secondary-soft">重新本关</button>
            <button type="button" id="btn-pause-room" class="eb-btn eb-btn--ghost">返回房间</button>
          </div>
        </div>
      </div>

      <!-- 回合结算卡片（Design System v1.0 16px 圆角卡片） -->
      <div id="result-modal" class="eb-modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="本局结算">
        <div class="eb-modal__backdrop"></div>
        <div class="eb-card">
          <p id="result-tag" class="eb-card__eyebrow">第 1 关 · 晴日草场</p>
          <h2 id="score" class="eb-card__score">0 / 11 只进圈</h2>
          <p id="stars" class="eb-card__stars" aria-label="本局星级">✦✦✦</p>
          <div id="reward-pill" class="eb-reward-pill">获得 +10 ✦</div>
          <p id="pet-reply" class="eb-card__reply"></p>
          <div class="eb-card__actions">
            <button type="button" id="next" class="eb-btn eb-btn--primary">下一关</button>
            <button type="button" id="again" class="eb-btn eb-btn--secondary-soft">重玩本关</button>
            <button type="button" id="back" class="eb-btn eb-btn--ghost" hidden>回第一关</button>
            <button type="button" id="btn-return-room" class="eb-btn eb-btn--ghost">返回房间</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
