<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>蛋宝宝 · 破壳起居室与专属试衣间</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app" class="page" data-period="day" data-state="free_stand">

    <!-- DEV-ONLY：默认隐藏，仅 ?demo=1 或 2.4s 内连点左上状态牌 5 次时显示（1:1 复刻小程序验收工具栈） -->
    <div id="dev-testers" class="dev-testers" hidden>
      <div class="stage-tester" style="top: calc(12px + env(safe-area-inset-top, 0px));">
        <button id="btn-acceptance-toggle" class="stage-tester-button" type="button" aria-label="展开验收工具">
          <span class="stage-tester-tag">验收</span><span>工具</span><span id="acceptance-chevron" class="stage-tester-chevron">⌄</span>
        </button>
      </div>

      <div id="acceptance-stack" class="acceptance-stack" hidden>
        <div class="tester-block">
          <button class="scene-tester-button" type="button" data-tester="period">
            <span class="scene-tester-tag">场景</span><span id="tester-period-label" class="scene-tester-current">白天</span><span class="scene-tester-chevron">⌄</span>
          </button>
          <div id="menu-period" class="scene-tester-menu" hidden></div>
        </div>

        <div class="tester-block">
          <button class="companion-state-tester-button" type="button" data-tester="state">
            <span class="companion-state-tester-tag">状态</span><span id="tester-state-label" class="companion-state-tester-current">桌面待机</span><span class="companion-state-tester-chevron">⌄</span>
          </button>
          <div id="menu-state" class="companion-state-tester-menu" hidden></div>
        </div>

        <div class="tester-block">
          <button class="prototype-tester-button" type="button" data-tester="pet">
            <span class="prototype-tester-tag">角色</span><span id="tester-pet-label">玉兔</span><span class="prototype-tester-chevron">⌄</span>
          </button>
          <div id="menu-pet" class="prototype-tester-menu" hidden></div>
        </div>

        <div class="tester-block">
          <button class="mood-tester-button" type="button" data-tester="mood">
            <span class="mood-tester-tag">心情</span><span id="tester-mood-label">🤔 好奇</span><span class="mood-tester-chevron">⌄</span>
          </button>
          <div id="menu-mood" class="mood-tester-menu" hidden></div>
        </div>
      </div>
    </div>

    <!-- 中场 34vh 场景反馈栈（1:1 复刻 scene-feedback-stack：dialogue 右下尖角话框 + system 深色半透明胶囊） -->
    <div id="scene-feedback-stack" class="scene-feedback-stack" aria-live="polite">
      <div id="feedback-back" class="scene-feedback-stack__back" hidden>
        <span id="feedback-back-text" class="scene-feedback-stack__text"></span>
      </div>
      <div id="feedback-front" class="scene-feedback-stack__card scene-feedback-stack__card--dialogue">
        <span id="feedback-front-text" class="scene-feedback-stack__text"></span>
      </div>
    </div>

    <!-- 左上状态栈：三阶可展开陪伴星星心情牌 + 可切换指针/数字小挂钟 -->
    <div id="life-status-stack" class="life-status-stack">
      <div class="pet-mood-anchor">
        <div id="pet-mood-tab" class="pet-mood-tab pet-mood-tab--post-hatch" role="button" tabindex="0" aria-label="查看蛋宝宝心情与陪伴天数">
          <div class="pet-mood-tab__room-header">
            <div class="pet-mood-tab__star-row">
              <span id="room-star-widget" class="companion-star companion-star--room">
                <span class="companion-star__halo"></span>
                <span class="companion-star__body">
                  <img class="companion-star__pose companion-star__pose--neutral" src="./ui/star_neutral.png" alt="" />
                </span>
                <span class="companion-star__dust companion-star__dust--1"></span>
                <span class="companion-star__dust companion-star__dust--2"></span>
                <span class="companion-star__dust companion-star__dust--3"></span>
              </span>
              <span id="hud-star-count" class="pet-mood-tab__star-value">120</span>
              <span id="hud-star-gain" class="pet-mood-tab__star-gain" hidden>+8</span>
            </div>
            <span id="hud-companion-days" class="pet-mood-tab__days">连续一起 12 天</span>
          </div>

          <div id="mood-room-detail" class="pet-mood-tab__room-detail pet-mood-tab__room-detail--open">
            <span id="hud-pet-name" class="pet-mood-tab__pet-name">糯米团子</span>
            <div class="pet-mood-tab__mood-inline">
              <span class="pet-mood-tab__mood-prefix">今日心情：</span>
              <span id="hud-mood-icon" class="pet-mood-tab__mood-emoji">🤔</span>
              <span id="hud-mood-label" class="pet-mood-tab__mood-name">好奇</span>
            </div>

            <div id="mood-room-sentence" class="pet-mood-tab__room-sentence">
              <p id="hud-mood-text" class="pet-mood-tab__sentence-text">我今天一直在想一件事，还没想明白。</p>
              <span class="pet-mood-tab__ai-note">内容由 AI 生成</span>
            </div>
          </div>
        </div>
      </div>

      <button id="room-clock" class="room-clock room-clock--analog" type="button" aria-label="切换时钟显示方式">
        <span id="clock-analog" class="clock-face">
          <span class="clock-number clock-number--twelve">12</span>
          <span class="clock-number clock-number--three">3</span>
          <span class="clock-number clock-number--six">6</span>
          <span class="clock-number clock-number--nine">9</span>
          <span id="clock-hand-hour" class="clock-hand clock-hand--hour"></span>
          <span id="clock-hand-minute" class="clock-hand clock-hand--minute"></span>
          <span id="clock-hand-second" class="clock-hand clock-hand--second"></span>
          <span class="clock-pin"></span>
        </span>
        <span id="clock-digital" class="clock-digital" hidden>
          <span id="clock-time-text" class="clock-time">14:30</span>
          <span id="clock-date-text" class="clock-date">11月23日 周一</span>
        </span>
      </button>
    </div>

    <!-- 主舞台：三屏连续全景画卷 + WebGL 实时毛绒宠物层 + 微距实拍道具层 -->
    <div id="scene-stage" class="scene-stage scene-stage--entered">
      <div id="world-scroll" class="world-scroll">
        <div id="world-track" class="world-track">
          <div id="camera-rig" class="camera-rig">
            <div id="pano-box" class="pano-box">
              <img id="pano-prev" class="world-panorama-bg world-panorama-bg--previous" alt="" hidden />
              <img id="pano-curr" class="world-panorama-bg" src="./panoramas/empty_day.png" alt="蛋宝宝的房间" />
              <img id="pano-preload" class="world-panorama-preload" alt="" hidden />

              <!-- 墙面微缩拍立得纪念框（收到明信片后钉在左中墙面植物画旁） -->
              <button id="wall-polaroid" class="wall-polaroid" type="button" hidden title="查看墙上的明信片">
                <span class="wall-polaroid__pin"></span>
                <img id="wall-polaroid-img" alt="纪念拍立得" />
              </button>

              <!-- 居家动作态下脱下的叠放毛衣包裹贴片（微距实拍透明 PNG，绝不使用带身体模特图） -->
              <button id="folded-outfit-prop" class="macro-prop macro-prop--folded" type="button" hidden aria-label="叠好的衣服">
                <img src="./props/prop_folded_knit.png" alt="" />
              </button>

              <!-- 桌面微距原木小立镜（点击推镜进入专属试衣间） -->
              <button id="desk-mirror-prop" class="macro-prop macro-prop--mirror" type="button" aria-label="照镜子试新衣">
                <img src="./props/prop_wood_mirror.png" alt="" />
              </button>

              <!-- WebGL 脚底接触双层软阴影 + 高清网格换装画布 -->
              <div id="pet-shadow-soft" class="pet-shadow pet-shadow--soft"></div>
              <div id="pet-shadow-contact" class="pet-shadow pet-shadow--contact"></div>
              <canvas id="gl-pet" class="gl-pet"></canvas>

              <!-- 试衣间聚光柔暗角 -->
              <div class="fitting-vignette" aria-hidden="true"></div>

              <!-- 角色热区、动作微光点与桌面跳跃交互层 -->
              <div id="scene-hit-layer" class="scene-hit-layer">
                <button id="character-hotspot" class="scene-character-hotspot" type="button" hidden aria-label="轻触蛋宝宝"></button>
                <button id="action-glow" class="action-glow" type="button" hidden aria-label="回应此刻的动作"></button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 顶部居中三屏圆点（1:1 对齐小程序 screen-dots） -->
      <div id="screen-dots" class="screen-dots" aria-hidden="true">
        <span class="screen-dot"></span>
        <span class="screen-dot screen-dot--active"></span>
        <span class="screen-dot"></span>
      </div>

      <!-- 左下情境入口：待拆信封（含纸飞机飞入 + 红点）/ 3D 伙伴对话圆标 -->
      <div id="scene-context-entry" class="scene-context-entry">
        <button id="btn-context-entry" class="scene-action-button scene-action-button--flat-envelope" type="button" aria-label="查看来信">
          <span id="letter-plane-fx" class="companion-letter-plane" aria-hidden="true"></span>
          <img id="context-entry-icon" class="scene-action-icon-image scene-action-icon-image--companion scene-action-icon-image--flat-envelope companion-letter-envelope--arriving" src="./ui/envelope.png" alt="" />
          <span id="context-unread-dot" class="companion-unread-dot"></span>
        </button>
      </div>

      <!-- 百宝箱外部点击遮罩 -->
      <div id="toolbox-dismiss" class="toolbox-dismiss" hidden></div>

      <!-- 右下功能 Dock：左「专属试衣间 3D 圆钮」 + 右「开盖 3D 百宝箱」 -->
      <div id="scene-action-dock" class="scene-action-dock">
        <button id="btn-open-fitting" class="scene-action-button" type="button" aria-label="进入专属试衣间">
          <img class="scene-action-icon-image scene-action-icon-image--wardrobe" src="./ui/wardrobe_3d.png" alt="" />
        </button>

        <div class="companion-toolbox-stack">
          <div id="companion-toolbox" class="companion-toolbox companion-toolbox--closed" aria-hidden="true">
            <div id="companion-toolbox-motion" class="companion-toolbox__motion">
              <div class="companion-toolbox__grid">
                <button id="tb-btn-album" class="companion-toolbox__item" type="button">
                  <span class="companion-toolbox__icon-wrap">
                    <img src="./ui/tb_postcards.png" alt="" />
                    <span id="tb-album-dot" class="companion-unread-dot" hidden></span>
                  </span>
                  <span>纪念册</span>
                </button>
                <button id="tb-btn-desk-toggle" class="companion-toolbox__item" type="button">
                  <img class="companion-toolbox__activity-icon" src="./ui/tb_activity.png" alt="" />
                  <span id="tb-desk-toggle-label">日常动作</span>
                </button>
                <button id="tb-btn-switch-pet" class="companion-toolbox__item" type="button">
                  <img src="./ui/tb_card.png" alt="" />
                  <span id="tb-switch-pet-label">换锦鲤</span>
                </button>
                <button id="tb-btn-sfx" class="companion-toolbox__item" type="button">
                  <img src="./ui/tb_settings.png" alt="" />
                  <span id="tb-sfx-label">音效：开</span>
                </button>
              </div>
            </div>
          </div>

          <button id="btn-toolbox" class="scene-action-button companion-toolbox-button" type="button" aria-label="打开百宝箱" aria-expanded="false">
            <span id="toolbox-btn-motion" class="companion-toolbox-button__motion">
              <span class="companion-toolbox-button__icons" aria-hidden="true">
                <img id="chest-lid-closed" class="companion-toolbox-button__lid companion-toolbox-button__lid--visible" src="./ui/chest_closed.png" alt="" />
                <img id="chest-lid-open" class="companion-toolbox-button__lid" src="./ui/chest_open.png" alt="" />
              </span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <!-- 专属试衣间覆盖层（同场景推镜 1.24x + 零遮挡顶部导航与底部 #FAFAF8 衣橱抽屉） -->
    <div id="fitting-topbar" class="fitting-topbar" aria-hidden="true">
      <button id="btn-exit-fitting" class="nav-circle-back" type="button" aria-label="返回房间">
        <span class="nav-circle-back__chevron"></span>
      </button>

      <div class="fitting-pet-seg" role="tablist" aria-label="切换试衣角色">
        <button class="fitting-pet-seg__btn is-active" type="button" data-fit-pet="yutu">玉兔</button>
        <button class="fitting-pet-seg__btn" type="button" data-fit-pet="koi">锦鲤</button>
      </div>

      <button id="btn-snap-lookbook" class="fitting-snap-pill" type="button">定妆照</button>
    </div>

    <section id="wardrobe-sheet" class="wardrobe-sheet" aria-label="专属试衣间衣橱" aria-hidden="true">
      <div id="sheet-grabber" class="wardrobe-sheet__grabber" title="收起试衣间"><span></span></div>

      <div class="wardrobe-sheet__header">
        <div id="wardrobe-filters" class="wardrobe-filters">
          <button class="wardrobe-filter is-active" type="button" data-filter="all">全部</button>
          <button class="wardrobe-filter" type="button" data-filter="owned">已拥有</button>
          <button class="wardrobe-filter" type="button" data-filter="locked">限定待解锁</button>
        </div>
        <div class="wardrobe-stars" aria-label="陪伴星星余额">
          <img src="./ui/star_neutral.png" alt="" />
          <span id="sheet-star-count">120</span>
        </div>
      </div>

      <div id="wardrobe-grid" class="wardrobe-grid"></div>

      <div class="wardrobe-sheet__footer">
        <button id="btn-revert-outfit" class="btn btn--secondary-soft wardrobe-footer-revert" type="button" hidden>
          <span class="btn-text">还原</span>
        </button>
        <button id="btn-confirm-outfit" class="btn btn--primary" type="button">
          <span id="confirm-outfit-text" class="btn-text">穿好啦</span>
        </button>
      </div>
    </section>

    <!-- 1:1 复刻小程序：今日陪伴红线折角信笺 + 哑光星星挤捏收星 + 带妆拍立得弹窗 -->
    <div id="today-companion-overlay" class="today-companion-overlay" role="dialog" aria-modal="true" aria-label="今日来信与带妆明信片" hidden>
      <div class="today-companion-stage">
        <div id="letter-award-box" class="today-companion-award">
          <div id="letter-award-star" class="companion-star companion-star--award">
            <span class="companion-star__halo"></span>
            <span class="companion-star__body">
              <img class="companion-star__pose companion-star__pose--neutral" src="./ui/star_neutral.png" alt="" />
              <img class="companion-star__pose companion-star__pose--squeezed" src="./ui/star_squeezed.png" alt="" />
            </span>
            <span class="companion-star__spark companion-star__spark--1"></span>
            <span class="companion-star__spark companion-star__spark--2"></span>
            <span class="companion-star__spark companion-star__spark--3"></span>
            <span class="companion-star__spark companion-star__spark--4"></span>
            <span class="companion-star__spark companion-star__spark--5"></span>
            <span class="companion-star__spark companion-star__spark--6"></span>
            <span class="companion-star__spark companion-star__spark--7"></span>
          </div>
          <span id="letter-award-plus" class="today-companion-award__plus">+8</span>
        </div>

        <div class="today-companion-letter">
          <button id="btn-close-letter" class="companion-close" type="button" aria-label="关闭信件">×</button>
          <span id="letter-title" class="today-companion-letter__title">寄自 · 晚霞云朵坡</span>
          <span id="letter-line" class="today-companion-letter__line">“傍晚路过云朵坡，风把长耳朵吹得软软的。”</span>

          <!-- 零 Token 带妆明信片场景切换栏（体验不同偶遇地点） -->
          <div id="postcard-scene-pills" class="postcard-scene-pills"></div>

          <div class="companion-memory-result">
            <div class="companion-polaroid">
              <img id="letter-polaroid-img" alt="带妆纪念明信片" />
              <div class="companion-polaroid__caption">
                <span id="polaroid-place" class="companion-polaroid__place">晚霞云朵坡</span>
                <span id="polaroid-outfit" class="companion-polaroid__outfit">身穿 · 奶油针织</span>
              </div>
            </div>
            <div class="companion-memory-result__actions">
              <button id="btn-download-polaroid" class="btn btn--secondary-soft btn--small" type="button">
                <span class="btn-text">保存相片</span>
              </button>
              <button id="btn-collect-letter" class="btn btn--primary btn--small" type="button">
                <span id="collect-letter-text" class="btn-text">收下</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 1:1 复刻小程序：全屏 #FAFAF8 纪念册画布页（遇见 | 明信片） -->
    <div id="keepsake-album-view" class="keepsake-page" role="dialog" aria-modal="true" aria-label="纪念册" hidden>
      <header class="eb-nav-bar">
        <button id="btn-close-album" class="eb-nav-bar__back" type="button" aria-label="返回">
          <span class="eb-nav-bar__chevron"></span>
        </button>
        <h2 class="eb-nav-bar__title">纪念册</h2>
        <span class="eb-nav-bar__spacer"></span>
      </header>

      <div class="keepsake-tabs">
        <div class="keepsake-tabs__track" role="tablist">
          <button class="keepsake-tab" type="button" data-album-tab="keepsakes">遇见</button>
          <button class="keepsake-tab keepsake-tab--active" type="button" data-album-tab="postcards">明信片</button>
        </div>
      </div>

      <div class="keepsake-body">
        <div id="keepsake-empty" class="keepsake-empty" hidden>
          <div class="keepsake-empty__ring" aria-hidden="true"></div>
          <p class="keepsake-empty__text">去和它待一会儿吧</p>
        </div>
        <div id="keepsake-grid" class="keepsake-grid"></div>
      </div>
    </div>

    <!-- 1:1 复刻小程序：明信片 / 遇见详情全屏画布页 -->
    <div id="keepsake-detail-view" class="keepsake-page keepsake-detail-page" role="dialog" aria-modal="true" aria-label="回忆详情" hidden>
      <header class="eb-nav-bar">
        <button id="btn-close-detail" class="eb-nav-bar__back" type="button" aria-label="返回纪念册">
          <span class="eb-nav-bar__chevron"></span>
        </button>
        <h2 id="detail-nav-title" class="eb-nav-bar__title">明信片</h2>
        <span class="eb-nav-bar__spacer"></span>
      </header>

      <div class="keepsake-detail-body">
        <div id="detail-hero-wrap" class="keepsake-detail-hero">
          <img id="detail-hero-img" alt="" />
        </div>
        <div class="keepsake-detail-meta">
          <h3 id="detail-title" class="keepsake-detail-title">晚霞云朵坡</h3>
          <span id="detail-badge" class="keepsake-detail-badge">身穿 · 奶油针织</span>
        </div>
        <p id="detail-story" class="keepsake-detail-story"></p>
        <span id="detail-date" class="keepsake-detail-date"></span>
        <div id="detail-download-wrap" class="keepsake-detail-actions">
          <button id="btn-detail-download" class="btn btn--secondary-soft btn--small" type="button">
            <span class="btn-text">保存高清拍立得</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script src="./app.js"></script>
</body>
</html>
